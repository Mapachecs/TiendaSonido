<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sonido Vivo - Tienda de Instrumentos</title>

  <!-- Bootstrap CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- CSS Propio -->
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-light">

  <!-- NAVBAR / BARRA SUPERIOR -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold text-uppercase d-flex align-items-center gap-2" href="index.html">
        <i class="bi bi-music-note-list text-primary fs-3"></i>
        <span>Sonido Vivo</span>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" href="index.html">Catálogo</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="mapa.html"><i class="bi bi-geo-alt me-1"></i>Puntos de Retiro</a>
          </li>
        </ul>

        <div class="d-flex align-items-center gap-3">
          <!-- Botón de Carrito -->
          <button class="btn btn-primary position-relative btn-sm px-3" data-bs-toggle="offcanvas" data-bs-target="#offcanvasCarrito">
            <i class="bi bi-cart3 me-1"></i> Carrito
            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="cart-count">0</span>
          </button>

          <!-- Contenedor Dinámico para Iniciar/Cerrar Sesión -->
          <div class="d-flex align-items-center gap-2" id="contenedorAuth">
            <a href="login.html" class="btn btn-outline-light btn-sm">
              <i class="bi bi-person-fill me-1"></i>Iniciar Sesión
            </a>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- SECCIÓN PRINCIPAL / CATÁLOGO -->
  <div class="container my-5">
    <div class="text-center mb-4">
      <h1 class="fw-bold">Catálogo de Instrumentos</h1>
      <p class="text-muted">Encuentra los mejores equipos de audio e instrumentos musicales</p>
    </div>

    <!-- Filtros y Búsqueda -->
    <div class="row g-3 mb-4">
      <div class="col-md-8">
        <div class="input-group">
          <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
          <input type="text" class="form-control" id="inputBuscar" placeholder="Buscar por nombre de producto...">
        </div>
      </div>
      <div class="col-md-4">
        <select class="form-select" id="selectCategoria">
          <option value="todas">Todas las categorías</option>
          <option value="Guitarras">Guitarras</option>
          <option value="Teclados">Teclados</option>
          <option value="Baterías">Baterías</option>
          <option value="Accesorios">Accesorios</option>
        </select>
      </div>
    </div>

    <!-- Contenedor de Productos -->
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4 align-items-start" id="contenedorProductos">
      <!-- Cargado dinámicamente con JS -->
    </div>
  </div>

  <!-- OFFCANVAS CARRITO DE COMPRAS -->
  <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasCarrito">
    <div class="offcanvas-header bg-dark text-white">
      <h5 class="offcanvas-title"><i class="bi bi-cart-check me-2"></i>Tu Carrito</h5>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body d-flex flex-column">
      <ul class="list-group list-group-flush mb-3" id="listaCarrito">
        <!-- Cargado dinámicamente con JS -->
      </ul>
      <div class="mt-auto border-top pt-3">
        <div class="d-flex justify-content-between align-items-center mb-3 fs-5 fw-bold">
          <span>Total:</span>
          <span class="text-primary" id="totalCarrito">$0</span>
        </div>
        <button class="btn btn-success w-100 py-2" onclick="alert('¡Gracias por tu compra en Sonido Vivo!')">
          Proceder al Pago
        </button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/index.js"></script>
</body>
</html>
