<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sonido Vivo - Panel de Administración</title>

  <!-- Bootstrap CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- CSS Propio -->
  <link rel="stylesheet" href="admin.css">
</head>
<body class="bg-light">

  <!-- BARRA DE NAVEGACIÓN ADMIN -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid px-4">
      <a class="navbar-brand fw-bold" href="#"><i class="bi bi-gear-wide-connected me-2"></i>Sonido Vivo - Panel</a>
      
      <div class="d-flex align-items-center gap-3 ms-auto">
        <span class="navbar-text text-white small" id="nombreUsuarioSesion">Cargando...</span>
        <button class="btn btn-outline-danger btn-sm" id="btnCerrarSesion">
          <i class="bi bi-box-arrow-right me-1"></i>Cerrar Sesión
        </button>
      </div>
    </div>
  </nav>

  <div class="container-fluid my-4 px-4">
    <div class="row">

      <!-- PESTAÑAS DE NAVEGACIÓN INTERNA -->
      <div class="col-12 mb-4">
        <ul class="nav nav-tabs" id="adminTabs" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active fw-bold" id="pedidos-tab" data-bs-toggle="tab" data-bs-target="#pedidos-pane" type="button" role="tab">
              <i class="bi bi-receipt me-1"></i>Gestión de Pedidos
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link fw-bold" id="stock-tab" data-bs-toggle="tab" data-bs-target="#stock-pane" type="button" role="tab">
              <i class="bi bi-box-seam me-1"></i>Control de Inventario
            </button>
          </li>
          <li class="nav-item" role="presentation" id="liUsuariosTab">
            <button class="nav-link fw-bold text-danger" id="usuarios-tab" data-bs-toggle="tab" data-bs-target="#usuarios-pane" type="button" role="tab">
              <i class="bi bi-people-fill me-1"></i>Usuarios (Solo Admin)
            </button>
          </li>
        </ul>
      </div>

      <div class="col-12">
        <div class="tab-content" id="adminTabsContent">

          <!-- 1. PESTAÑA: PEDIDOS -->
          <div class="tab-pane fade show active" id="pedidos-pane" role="tabpanel">
            <div class="card border-0 shadow-sm">
              <div class="card-body">
                <h5 class="card-title fw-bold mb-3"><i class="bi bi-clock-history me-2"></i>Pedidos de Clientes</h5>
                <div class="table-responsive">
                  <table class="table table-hover align-middle">
                    <thead class="table-dark">
                      <tr>
                        <th>N° Pedido</th>
                        <th>Cliente</th>
                        <th>Fecha</th>
                        <th>Total</th>
                        <th>Estado</th>
                        <th>Acción</th>
                      </tr>
                    </thead>
                    <tbody id="tablaPedidos">
                      <!-- Cargado dinámicamente con JS -->
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>

          <!-- 2. PESTAÑA: STOCK / INVENTARIO -->
          <div class="tab-pane fade" id="stock-pane" role="tabpanel">
            <div class="card border-0 shadow-sm">
              <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-3">
                  <h5 class="card-title fw-bold m-0"><i class="bi bi-boxes me-2"></i>Inventario de Productos</h5>
                  <button class="btn btn-primary btn-sm"><i class="bi bi-plus-circle me-1"></i>Nuevo Producto</button>
                </div>
                <div class="table-responsive">
                  <table class="table table-hover align-middle">
                    <thead class="table-dark">
                      <tr>
                        <th>ID</th>
                        <th>Producto</th>
                        <th>Categoría</th>
                        <th>Precio</th>
                        <th>Stock Actual</th>
                        <th>Acciones</th>
                      </tr>
                    </thead>
                    <tbody id="tablaStock">
                      <!-- Cargado dinámicamente con JS -->
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>

          <!-- 3. PESTAÑA: USUARIOS (Solo Administrador) -->
          <div class="tab-pane fade" id="usuarios-pane" role="tabpanel">
            <div class="card border-0 shadow-sm border-top border-danger border-3">
              <div class="card-body">
                <h5 class="card-title fw-bold mb-3 text-danger"><i class="bi bi-shield-lock me-2"></i>Gestión de Usuarios del Sistema</h5>
                <div class="table-responsive">
                  <table class="table table-hover align-middle">
                    <thead class="table-secondary">
                      <tr>
                        <th>Nombre</th>
                        <th>Correo</th>
                        <th>Rol</th>
                        <th>Estado</th>
                        <th>Cambiar Rol</th>
                      </tr>
                    </thead>
                    <tbody id="tablaUsuarios">
                      <!-- Cargado dinámicamente con JS -->
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>

        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
