<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sonido Vivo - Ubicación y Puntos de Retiro</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- CSS de Leaflet (para el mapa) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  
  <link rel="stylesheet" href="../css/mapa.css">
</head>
<body>

   <!-- BARRA DE NAVEGACIÓN -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-music-note-beamed me-2"></i>Sonido Vivo</a>
    
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link active" href="index.html">Catálogo</a></li>
        <li class="nav-item"><a class="nav-link" href="Mapa.html">Ubicación</a></li>
      </ul>
      <div class="d-flex align-items-center gap-3">
        <a href="login.html" class="btn btn-outline-light btn-sm"><i class="bi bi-person-fill me-1"></i>Iniciar Sesión</a>
        <button class="btn btn-warning position-relative" data-bs-toggle="modal" data-bs-target="#modalCarrito">
          <i class="bi bi-cart-fill"></i>
          <span id="cart-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
        </button>
      </div>
    </div>
  </div>
</nav>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="container my-4">
    <div class="row">
      <!-- Columna de información -->
      <div class="col-lg-4 mb-4">
        <div class="card shadow-sm border-0 h-100">
          <div class="card-body">
            <h2 class="h4 card-title fw-bold text-primary mb-3">
              <i class="bi bi-geo-alt-fill me-2"></i>Nuestras Surtidoras
            </h2>
            <p class="text-muted small">Haz clic en cualquier punto del mapa o selecciona una opción a continuación para ver los detalles e indicaciones de cómo llegar.</p>
            
            <div class="list-group list-group-flush mt-3" id="listaPuntos">
              <!-- Cargado dinámicamente con JS -->
            </div>
          </div>
        </div>
      </div>

      <!-- Columna del Mapa Interactivo -->
      <div class="col-lg-8 mb-4">
        <div class="card shadow-sm border-0">
          <div class="card-body p-2">
            <!-- Contenedor donde se dibuja el mapa -->
            <div id="mapa"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- JS de Leaflet -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <!-- JS de Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- JS propio para el Mapa -->
  <script src="../js/mapa.js"></script>
</body>
</html>
