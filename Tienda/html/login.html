<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sonido Vivo - Iniciar Sesión / Registro</title>
  
  <!-- Bootstrap CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- CSS Propio -->
  <link rel="stylesheet" href="../css/login.css">
</head>
<body class="bg-light d-flex align-items-center min-vh-100 py-5">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        
        <!-- Tarjeta de Autenticación -->
        <div class="card shadow border-0">
          <div class="card-body p-4 p-md-5">
            
            <div class="text-center mb-4">
              <a href="index.html" class="text-decoration-none text-dark h3 fw-bold">
                <i class="bi bi-music-note-beamed text-primary me-2"></i>Sonido Vivo
              </a>
              <p class="text-muted small mt-1">Gestión de Acceso a la Plataforma</p>
            </div>

            <!-- Pestañas para cambiar entre Login y Registro -->
            <ul class="nav nav-pills nav-justified mb-4" id="authTabs" role="tablist">
              <li class="nav-item" role="presentation">
                <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login-pane" type="button" role="tab">Ingresar</button>
              </li>
              <li class="nav-item" role="presentation">
                <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register-pane" type="button" role="tab">Registrarse</button>
              </li>
            </ul>

            <div class="tab-content" id="authTabsContent">
              
              <!-- 1. FORMULARIO DE LOGIN -->
              <div class="tab-pane fade show active" id="login-pane" role="tabpanel">
                <form id="formLogin">
                  <div class="mb-3">
                    <label for="loginEmail" class="form-label">Correo Electrónico</label>
                    <input type="email" class="form-control" id="loginEmail" placeholder="nombre@correo.com" required>
                  </div>
                  <div class="mb-3">
                    <label for="loginPassword" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="loginPassword" required>
                  </div>
                  <div id="loginError" class="alert alert-danger d-none py-2 fs-6"></div>
                  <button type="submit" class="btn btn-primary w-100 py-2">Iniciar Sesión</button>
                </form>

                <!-- Cuentas de prueba rápidas para presentación académica -->
                <div class="mt-4 p-3 bg-light rounded border text-muted small">
                  <span class="fw-bold d-block text-dark mb-1">Cuentas demo para pruebas:</span>
                  <div>• Admin: <code>admin@sonidovivo.cl</code> / 123</div>
                  <div>• Vendedor: <code>vendedor@sonidovivo.cl</code> / 123</div>
                  <div>• Cliente: <code>cliente@correo.com</code> / 123</div>
                </div>
              </div>

              <!-- 2. FORMULARIO DE REGISTRO (Clientes) -->
              <div class="tab-pane fade" id="register-pane" role="tabpanel">
                <form id="formRegister">
                  <div class="mb-3">
                    <label for="regNombre" class="form-label">Nombre Completo</label>
                    <input type="text" class="form-control" id="regNombre" required>
                  </div>
                  <div class="mb-3">
                    <label for="regEmail" class="form-label">Correo Electrónico</label>
                    <input type="email" class="form-control" id="regEmail" required>
                  </div>
                  <div class="mb-3">
                    <label for="regPassword" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="regPassword" minlength="3" required>
                  </div>
                  <div id="regSuccess" class="alert alert-success d-none py-2 fs-6"></div>
                  <button type="submit" class="btn btn-success w-100 py-2">Crear Cuenta Cliente</button>
                </form>
              </div>

            </div>

            <div class="text-center mt-4">
              <a href="index.html" class="text-secondary small"><i class="bi bi-arrow-left me-1"></i>Volver a la tienda</a>
            </div>

          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>
